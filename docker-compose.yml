services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
      POSTGRES_DB: procurement
    ports:
      - "5432:5432"
    volumes:
      - procurement_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://procurement:procurement@db:5432/procurement
    depends_on:
      db:
        condition: service_healthy

volumes:
  procurement_db_data:
